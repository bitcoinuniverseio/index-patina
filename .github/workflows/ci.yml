name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, universe-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify vendored package
        run: npm run verify:vendor

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Command line smoke test
        env:
          PATINA_NETWORK: regtest
          PATINA_RPC_OFFLINE: 'true'
          PATINA_DATA_DIR: ${{ runner.temp }}/patina-ci
          PATINA_LOG_LEVEL: silent
        run: |
          node bin/index-patina.mjs status --json
          node bin/index-patina.mjs verify

  docker:
    needs: build-and-test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, universe-ci, linux-container-builder]
    timeout-minutes: 20
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify the image
        uses: bitcoinuniverseio/universe-ci-actions/portable-container-build@be40d57392687ec250a02b1096cb1c4db5782b74
        with:
          tag: index-patina:${{ github.sha }}
          run-environment: |
            PATINA_NETWORK=regtest
            PATINA_RPC_OFFLINE=true
            PATINA_LOG_LEVEL=silent
          run-command-json: '["status","--json"]'
