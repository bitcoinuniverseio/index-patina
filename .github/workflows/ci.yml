name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    uses: bitcoinuniverseio/.github-private/.github/workflows/route.yml@develop
    secrets: inherit
    with:
      plan: '{"build_and_test":"light","docker_2":"docker"}'

  build-and-test:
    needs: route
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.route.outputs.targets).build_and_test }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Pin npm
        run: |
          npm install --global npm@11.17.0
          if ((node --version).Trim() -ne 'v24.19.0') { throw 'Unexpected Node version' }
          if ((npm --version).Trim() -ne '11.17.0') { throw 'Unexpected npm version' }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify vendored package
        run: npm run verify:vendor

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Command line smoke test
        env:
          PATINA_NETWORK: regtest
          PATINA_RPC_OFFLINE: 'true'
          PATINA_DATA_DIR: ${{ runner.temp }}/patina-ci
          PATINA_LOG_LEVEL: silent
        run: |
          node bin/index-patina.mjs status --json
          node bin/index-patina.mjs verify

  docker:
    needs: [route, build-and-test]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(needs.route.outputs.targets).docker_2 }}
    timeout-minutes: 20
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify the image
        uses: bitcoinuniverseio/king/.github/actions/portable-container-build@d0463e3ceb2a284cc52afc76291be623f73e5477
        with:
          tag: index-patina:${{ github.sha }}
          run-environment: |
            PATINA_NETWORK=regtest
            PATINA_RPC_OFFLINE=true
            PATINA_LOG_LEVEL=silent
          run-command-json: '["status","--json"]'
