name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # This repository is public and the capacity router is a reusable workflow
    # in the private .github-private, which a public caller cannot resolve.
    # Target the ultra pool directly until the router is published somewhere a
    # public repository can reach.
    runs-on: [self-hosted, linux, x64, universe-super]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@8e24bc760556caa5ec8c7c497baaad2e9adcc912
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify vendored package
        run: npm run verify:vendor

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        env:
          PATINA_WIRE_FIXTURE_OUTPUT: ${{ runner.temp }}/patina-wire.json
        run: npm test

      - name: Preserve controlled API contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patina-wire-contract
          path: ${{ runner.temp }}/patina-wire.json
          if-no-files-found: error
          retention-days: 14

      - name: Command line smoke test
        env:
          PATINA_NETWORK: regtest
          PATINA_RPC_OFFLINE: 'true'
          PATINA_DATA_DIR: ${{ runner.temp }}/patina-ci
          PATINA_LOG_LEVEL: silent
        run: |
          node bin/index-patina.mjs status --json
          node bin/index-patina.mjs verify

  docker:
    needs: build-and-test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, universe-super]
    # Cold Docker layers on the shared fleet exceeded twenty minutes while
    # still making progress; retain a bounded run with room for native SQLite.
    timeout-minutes: 45
    steps:
      - name: Check out the indexer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This public repository resolves the portable action from the public
      # universe-ci-actions mirror at the pin validated on develop.
      - name: Build and verify the image
        uses: bitcoinuniverseio/universe-ci-actions/portable-container-build@593cc2d9169d9598ba89040fbc8606a0ad8d351f
        with:
          tag: index-patina:${{ github.sha }}
          run-environment: |
            PATINA_NETWORK=regtest
            PATINA_RPC_OFFLINE=true
            PATINA_LOG_LEVEL=silent
          run-command-json: '["status","--json"]'
